services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cinc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cinc
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cinc_default
    mem_limit: 400m

  bot:
    build: ./bot
    container_name: cinc_bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    networks:
      - cinc_default
    mem_limit: 350m

networks:
  cinc_default:
    driver: bridge

volumes:
  db_data:
